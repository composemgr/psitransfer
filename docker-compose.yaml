# nginx proxy address - http://172.17.0.1:64318

name: psitransfer
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: psitrax/psitransfer:latest
    container_name: psitransfer-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: psitransfer-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      SITE_NAME: ${APP_ORG_NAME:-PSI Transfer}
      SITE_URL: https://${BASE_HOST_NAME:-$HOSTNAME}
      SESSION_SECRET: ${APP_SECRET_KEY:-replace-with-a-random-32-byte-hex-string}
    ports:
      - '172.17.0.1:64318:3000'
    volumes:
      - './volumes/data/psitransfer:/app/data:z'
    networks:
      - psitransfer

networks:
  psitransfer:
    name: psitransfer
    external: false
